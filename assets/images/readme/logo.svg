<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0d1527" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080a10" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="amber-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Clip Path for Card -->
    <clipPath id="card-clip">
      <rect x="10" y="10" width="880" height="220" rx="16" />
    </clipPath>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      letter-spacing: 6px;
      fill: url(#text-grad);
    }
    .brand-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 3.5px;
      fill: #38bdf8;
      text-transform: uppercase;
    }
    .brand-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 1px;
      fill: #e2e8f0;
      text-transform: uppercase;
    }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="880" height="220" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Ambient Light Orbs inside banner -->
  <g clip-path="url(#card-clip)">
    <!-- Backlight Bloom -->
    <circle cx="125" cy="120" r="85" fill="#38bdf8" opacity="0.15" filter="url(#soft-glow)" />
    <circle cx="150" cy="110" r="55" fill="#c084fc" opacity="0.12" filter="url(#soft-glow)" />
    <circle cx="780" cy="40" r="120" fill="#6366f1" opacity="0.08" filter="url(#soft-glow)" />

    <!-- Grid Accent Lines -->
    <line x1="10" y1="60" x2="890" y2="60" stroke="#334155" stroke-opacity="0.15" stroke-dasharray="4 8" />
    <line x1="10" y1="180" x2="890" y2="180" stroke="#334155" stroke-opacity="0.15" stroke-dasharray="4 8" />
    <line x1="260" y1="10" x2="260" y2="230" stroke="#334155" stroke-opacity="0.2" />
  </g>

  <!-- ==================== ICON MARK (Left: Lithophane Relief + Archimedean Spiral) ==================== -->
  <g transform="translate(135, 120)">
    <!-- Outer Lithophane Frame -->
    <rect x="-70" y="-70" width="140" height="140" rx="14" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />
    <rect x="-62" y="-62" width="124" height="124" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5" />

    <!-- Backlight Radiance (Lithophane Core) -->
    <circle cx="0" cy="0" r="46" fill="url(#amber-light)" opacity="0.35" filter="url(#glow)" />

    <!-- Layered Relief Depth Polygons (Simulating Lithophane Z-Levels) -->
    <!-- Layer 1 (Deepest / Darkest) -->
    <path d="M -45 42 L -20 -35 L 25 -42 L 46 20 L 20 45 Z" fill="#1e293b" fill-opacity="0.7" />

    <!-- Layer 2 (Mid-relief) -->
    <path d="M -38 35 L -12 -28 L 20 -32 L 38 15 L 12 38 Z" fill="#334155" fill-opacity="0.5" />

    <!-- Layer 3 (High-relief Translucent) -->
    <path d="M -28 25 L -5 -20 L 15 -22 L 28 8 L 8 28 Z" fill="#38bdf8" fill-opacity="0.2" />

    <!-- Archimedean Spiral Path (Continuous Filament / Spiral Betty Stroke) -->
    <path d="
      M 0 0
      A 3 3 0 0 1 3 3
      A 7 7 0 0 1 -4 7
      A 12 12 0 0 1 -12 -5
      A 18 18 0 0 1 7 -18
      A 25 25 0 0 1 25 9
      A 33 33 0 0 1 -11 33
      A 42 42 0 0 1 -42 -14
      A 52 52 0 0 1 17 -52
    " fill="none" stroke="url(#primary-grad)" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)" />

    <!-- Radiant Light Points -->
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" filter="url(#glow)" />
    <circle cx="17" cy="-52" r="2.5" fill="#38bdf8" />
  </g>

  <!-- ==================== TYPOGRAPHY & BRANDING (Right) ==================== -->
  <g transform="translate(295, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="168" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="10" cy="11" r="3.5" fill="#38bdf8" />
      <text x="20" y="14.5" class="badge-text">3D PRINTING &amp; ART</text>
    </g>

    <!-- Version Pill -->
    <g transform="translate(176, 48)">
      <rect x="0" y="0" width="62" height="22" rx="11" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="31" y="14.5" text-anchor="middle" class="badge-text" fill="#94a3b8">v1.1.0</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="122" class="brand-title">LUMINA</text>

    <!-- Subtitle -->
    <text x="3" y="152" class="brand-subtitle">LITHOPHANE &amp; SPIRAL BETTY 3D GENERATOR</text>

    <!-- Description -->
    <text x="3" y="184" class="brand-desc">High-precision heightmaps, vector spiral continuous lines &amp; real-time 3D backlight simulation</text>
  </g>
</svg>
