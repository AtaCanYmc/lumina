<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
    </linearGradient>

    <!-- Spiral Gradient (Light to Cyan to Violet) -->
    <linearGradient id="spiral-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Amber Backlight Core Gradient -->
    <radialGradient id="backlight-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>

    <!-- Central Lens Flare Glow -->
    <radialGradient id="center-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#bae6fd" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Facet Depth Gradients -->
    <linearGradient id="facet-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="facet-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow-effect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="squircle-clip">
      <rect x="20" y="20" width="472" height="472" rx="108" ry="108" />
    </clipPath>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5" />

  <!-- Clipped Interior Graphics (Guarantees zero overflow) -->
  <g clip-path="url(#squircle-clip)">
    <!-- Ambient Internal Light Field -->
    <circle cx="256" cy="256" r="220" fill="url(#backlight-glow)" />

    <!-- Subtle Geometric Relief Grid (Simulating 3D Lithophane Heightmap Mesh) -->
    <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
      <circle cx="256" cy="256" r="60" fill="none" stroke-dasharray="2 6" />
      <circle cx="256" cy="256" r="110" fill="none" stroke-dasharray="3 8" />
      <circle cx="256" cy="256" r="160" fill="none" stroke-dasharray="4 10" />
      <line x1="256" y1="56" x2="256" y2="456" stroke-dasharray="4 8" />
      <line x1="56" y1="256" x2="456" y2="256" stroke-dasharray="4 8" />
    </g>

    <!-- 3D Lithophane Faceted Planes (Angular depth variation) -->
    <g transform="translate(256, 256)">
      <!-- Base Relief Octagon -->
      <polygon points="0,-140 99,-99 140,0 99,99 0,140 -99,99 -140,0 -99,-99"
               fill="#0f172a" fill-opacity="0.5" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" />

      <!-- Faceted Depth Shards -->
      <polygon points="0,-140 99,-99 0,0" fill="url(#facet-1)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
      <polygon points="99,-99 140,0 0,0" fill="url(#facet-2)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
      <polygon points="140,0 99,99 0,0" fill="url(#facet-1)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
      <polygon points="99,99 0,140 0,0" fill="url(#facet-2)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
      <polygon points="0,140 -99,99 0,0" fill="url(#facet-1)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
      <polygon points="-99,99 -140,0 0,0" fill="url(#facet-2)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
      <polygon points="-140,0 -99,-99 0,0" fill="url(#facet-1)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
      <polygon points="-99,-99 0,-140 0,0" fill="url(#facet-2)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />

      <!-- Mid-depth Plate -->
      <polygon points="0,-90 64,-64 90,0 64,64 0,90 -64,64 -90,0 -64,-64"
               fill="#1e293b" fill-opacity="0.6" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.5" />

      <!-- Inner Core Plate -->
      <polygon points="0,-50 35,-35 50,0 35,35 0,50 -35,35 -50,0 -35,-35"
               fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5" />

      <!-- Radiant Archimedean Spiral Path (Continuous Vector Line) -->
      <path d="
        M 0 0
        A 6 6 0 0 1 6 6
        A 14 14 0 0 1 -8 14
        A 24 24 0 0 1 -24 -10
        A 36 36 0 0 1 14 -36
        A 50 50 0 0 1 50 18
        A 66 66 0 0 1 -22 66
        A 84 84 0 0 1 -84 -28
        A 104 104 0 0 1 34 -104
        A 126 126 0 0 1 126 42
        A 150 150 0 0 1 -50 150
      " fill="none" stroke="url(#spiral-grad)" stroke-width="5" stroke-linecap="round" filter="url(#glow-effect)" />

      <!-- Center Light Focal Flare -->
      <circle cx="0" cy="0" r="14" fill="url(#center-flare)" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />

      <!-- Light Particle Accents -->
      <circle cx="-50" cy="150" r="3.5" fill="#a855f7" filter="url(#glow-effect)" />
      <circle cx="126" cy="42" r="2.5" fill="#38bdf8" />
      <circle cx="34" cy="-104" r="2" fill="#ffffff" />
    </g>
  </g>
</svg>
