name: Build macOS Application Bundle

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-dmg:
    name: Build macOS DMG (Universal / Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .[gui]
          pip install pyinstaller

      - name: Build macOS .app and .dmg
        run: |
          bash packaging/macos/build_dmg.sh

      - name: Upload DMG as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/*.dmg --clobber
