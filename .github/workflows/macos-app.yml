name: Build macOS Application Bundle

on:
  push:
    branches:
      - main
    paths:
      - "packaging/**"
      - "src/**"
      - ".github/workflows/macos-app.yml"
    tags:
      - 'v*'
      - 'lumina-tools-v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-macos-dmg:
    name: Build macOS DMG (Universal / Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .[gui]
          pip install pyinstaller

      - name: Build macOS .app and .dmg
        run: |
          PYTHON=python bash packaging/macos/build_dmg.sh

      - name: Upload DMG as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          fi
          echo "Target release tag: $TAG"
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" dist/*.dmg --clobber
            echo "Successfully attached DMG to release $TAG"
          else
            echo "Creating release v1.1.0 and attaching DMG..."
            gh release create "v1.1.0" dist/*.dmg --title "Lumina Studio v1.1.0 (macOS)" --notes "Standalone macOS application bundle (Apple Silicon M-series and Intel Universal)." --clobber
          fi
