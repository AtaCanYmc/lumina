name: Publish Python package

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Validate tag matches pyproject version
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path

          ref = os.environ.get('GITHUB_REF_NAME') or os.environ.get('GITHUB_REF', '')
          # If GITHUB_REF_NAME not set, try to extract from GITHUB_REF
          if not ref and os.environ.get('GITHUB_REF'):
              ref = os.environ['GITHUB_REF'].rsplit('/', 1)[-1]

          m = re.match(r'^v(\d+\.\d+\.\d+)$', ref)
          if not m:
              raise SystemExit(f"Tag {ref!r} is not in vMAJOR.MINOR.PATCH format")

          tag_ver = m.group(1)
          text = Path('pyproject.toml').read_text(encoding='utf-8')
          m2 = re.search(r'^\s*version\s*=\s*"([^"]+)"\s*$', text, re.M)
          if not m2:
              raise SystemExit('Could not find version in pyproject.toml')
          file_ver = m2.group(1)

          if tag_ver != file_ver:
              raise SystemExit(f"Tag version {tag_ver} does not match pyproject.toml version {file_ver}")
          print(f"OK: tag {tag_ver} matches pyproject.toml")
          PY

      - name: Build distributions
        run: |
          python -m build --sdist --wheel

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install twine
          python -m twine upload dist/*

      - name: Generate changelog for release
        id: changelog
        run: |
          # Ensure tags are present
          git fetch --tags
          # Try to get previous tag; if none, include all commits
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s (%an)' "$PREV_TAG"..HEAD > changelog.md || true
          else
            git log --pretty=format:'- %s (%an)' > changelog.md || true
          fi

          # Write multi-line output safely: ensure EOF is always written and on its own line
          if [ -f changelog.md ]; then
            echo 'body<<END' >> "$GITHUB_OUTPUT"
            # Prefix each line with a space and ensure there's a trailing newline
            awk '{ print " " $0 } END { if (NR==0) print "" }' changelog.md >> "$GITHUB_OUTPUT" || true
            # Ensure a final newline so the closing delimiter is on its own line
            echo >> "$GITHUB_OUTPUT"
            echo 'END' >> "$GITHUB_OUTPUT"
          else
            echo 'body<<END' >> "$GITHUB_OUTPUT"
            echo >> "$GITHUB_OUTPUT"
            echo 'END' >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
